name: Unit tests

# Advanced feature: only run when it is useful.
on:
  push:
    branches: [main]            # run on main only; feature branches are covered by pull requests
    paths:                      # skip runs when only docs / non-code files change
      - "**.py"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  workflow_dispatch:            # lets you run it manually (useful for the demo)

# If new commits arrive while an older run is still going, cancel the old run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run unit tests
        run: pytest -v